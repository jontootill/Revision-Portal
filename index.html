<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Portal</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h1>Revision Portal</h1>
        </div>
        <div class="user-profile-badge" id="headerYearBadge">
            <span class="badge-label">Active Profile:</span>
            <span class="badge-value" id="currentProfileDisplay">Not Set</span>
        </div>
    </header>

    <main class="container">
        
        <!-- STEP 1: PROFILE SELECTION -->
        <section class="card profile-card">
            <h2>Set Your Study Profile</h2>
            <p class="subtitle">Choose your year group to unlock matching topics.</p>

            <div class="form-row">
                <div class="form-group">
                    <label for="yearSelect">Year Group:</label>
                    <select id="yearSelect">
                        <option value="">-- Select Year --</option>
                        <!-- FIXED: Values must match actual year numbers (7-11) -->
                        <option value="7">Year 7</option>
                        <option value="8">Year 8</option>
                        <option value="9">Year 9</option>
                        <option value="10">Year 10</option>
                        <option value="11">Year 11</option>
                    </select>
                </div>

                <!-- GCSE OPTIONS WRAPPER -->
                <div id="gcseOptions" class="gcse-options hidden">
                    <div class="form-group">
                        <label for="routeSelect">Course Route:</label>
                        <select id="routeSelect">
                            <option value="1">Combined Science</option>
                            <option value="2">Triple Science</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tierSelect">Tier:</label>
                        <select id="tierSelect">
                            <option value="1">Foundation</option>
                            <option value="2">Higher</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="saveProfileBtn" class="btn-primary">Confirm Profile</button>
        </section>

        <!-- STEP 2: REVISION TOPIC LAUNCHER -->
        <section class="card launcher-card" id="launcherSection">
            <h2>2. Select a Revision Topic</h2>
            
            <div class="form-group">
                <label for="subjectSelect">Subject:</label>
                <select id="subjectSelect" disabled>
                    <option value="">-- Select Subject --</option>
                    <!-- Subject IDs matching curriculum.json -->
                    <option value="1">Biology</option>
                    <option value="2">Chemistry</option>
                    <option value="3">Physics</option>
                </select>
            </div>

            <div class="form-group">
                <label for="topicSelect">Topic:</label>
                <select id="topicSelect" disabled>
                    <option value="">-- Select Topic --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="subtopicSelect">Subtopic:</label>
                <!-- FIXED: Changed ID from subtopic-select to subtopicSelect -->
                <select id="subtopicSelect" disabled>
                    <option value="all">All Subtopics</option>
                </select>
            </div>

            <div class="button-group">
                <button id="startQuizBtn" class="btn-primary" disabled>Start 10-Question Quiz</button>
                <button id="randomiseAllBtn" class="btn-secondary" disabled>Randomise All Topics</button>
            </div>
        </section>

    </main>


    <script src="js/app.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
